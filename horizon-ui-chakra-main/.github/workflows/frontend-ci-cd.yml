# SMD VITAL Frontend - CI/CD Pipeline
# ===================================

name: Frontend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'horizon-ui-chakra-main/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'horizon-ui-chakra-main/**'

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/smd-vital-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./horizon-ui-chakra-main
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: horizon-ui-chakra-main/package-lock.json
    
    - name: Install dependencies
      run: npm ci --only=production --no-audit --no-fund
    
    - name: Run linting
      run: npm run lint
    
    - name: Run tests
      run: npm run test:coverage
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./horizon-ui-chakra-main/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./horizon-ui-chakra-main
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: horizon-ui-chakra-main/package-lock.json
    
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    
    - name: Build application
      run: npm run build:optimized
      env:
        NODE_ENV: production
        GENERATE_SOURCEMAP: false
        DISABLE_ESLINT_PLUGIN: true
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: horizon-ui-chakra-main/build/
        retention-days: 7

  docker:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./horizon-ui-chakra-main
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./horizon-ui-chakra-main
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NODE_ENV=production
          GENERATE_SOURCEMAP=false
          DISABLE_ESLINT_PLUGIN=true

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./horizon-ui-chakra-main
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: horizon-ui-chakra-main/package-lock.json
    
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    
    - name: Run security audit
      run: npm audit --audit-level=moderate
    
    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

  deploy:
    needs: [build, docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to production
      run: |
        echo "Deploying to production..."
        # Aquí irían los comandos específicos de deployment
        # Por ejemplo, para Render, Heroku, etc.
