[tool:pytest]
# Configuración de pytest para SMD VITAL
# ======================================

# Directorios de pruebas
testpaths = tests

# Patrones de archivos de prueba
python_files = test_*.py *_test.py

# Patrones de clases de prueba
python_classes = Test*

# Patrones de funciones de prueba
python_functions = test_*

# Marcadores personalizados
markers =
    unit: Pruebas unitarias
    integration: Pruebas de integración
    security: Pruebas de seguridad
    load: Pruebas de carga
    critical: Pruebas críticas
    auth: Pruebas de autenticación
    appointments: Pruebas de citas médicas
    users: Pruebas de usuarios
    medical: Pruebas de registros médicos
    payments: Pruebas de pagos
    notifications: Pruebas de notificaciones
    ai: Pruebas de IA médica
    slow: Pruebas lentas
    fast: Pruebas rápidas

# Configuración de cobertura
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=.
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=term-missing
    --cov-fail-under=70
    --cov-branch
    --cov-report=json:coverage.json

# Filtros de advertencias
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pydantic.*

# Configuración de logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout para pruebas
timeout = 300

# Configuración de asyncio
asyncio_mode = auto

# Configuración de fixtures
usefixtures = 
    test_client
    mock_database
    mock_redis
    mock_ai_service

# Configuración de plugins
plugins = 
    pytest-cov
    pytest-asyncio
    pytest-mock
    pytest-timeout
    pytest-html
    pytest-json-report

# Configuración de reportes
htmlpath = reports/pytest_report.html
json_report = reports/pytest_report.json
json_report_include = ["test_id", "duration", "outcome", "setup", "call", "teardown"]

# Configuración de paralelización (opcional)
# addopts = --numprocesses=auto --dist=loadfile

# Variables de entorno para pruebas
env = 
    TESTING = true
    DATABASE_URL = sqlite:///test.db
    REDIS_URL = redis://localhost:6379/1
    JWT_SECRET = test_secret_key
    AI_API_KEY = test_ai_key



