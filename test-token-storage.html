<!DOCTYPE html>
<html>
<head>
    <title>Test Token Storage</title>
</head>
<body>
    <h1>Test Token Storage</h1>
    <button onclick="testTokenStorage()">Test Token Storage</button>
    <div id="result"></div>

    <script>
        function testTokenStorage() {
            const testToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhOWNkZmU3OS1lMTYwLTQ4MTQtOWQyYy1jM2JkOTgzNmY4MzEiLCJlbWFpbCI6InRlc3RAZXhhbXBsZS5jb20iLCJyb2xlIjoidXNlciIsImV4cCI6MTc1ODIyNjY4NSwidHlwZSI6ImFjY2VzcyJ9.ZU3fi-_XqxVEE_VhzabsIvcSB5aMTm8wU97ywVqUCXI";
            
            // Simular el proceso de login
            localStorage.setItem('smd_vital_token', testToken);
            
            // Verificar que se guardó correctamente
            const savedToken = localStorage.getItem('smd_vital_token');
            
            document.getElementById('result').innerHTML = `
                <p>Token guardado: ${savedToken ? 'Sí' : 'No'}</p>
                <p>Token recuperado: ${savedToken}</p>
                <p>Tokens coinciden: ${savedToken === testToken ? 'Sí' : 'No'}</p>
            `;
            
            // Probar la API
            fetch('http://localhost:8000/api/auth/me', {
                headers: {
                    'Authorization': `Bearer ${savedToken}`
                }
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerHTML += `
                    <h3>API Response:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            })
            .catch(error => {
                document.getElementById('result').innerHTML += `
                    <h3>API Error:</h3>
                    <p>${error.message}</p>
                `;
            });
        }
    </script>
</body>
</html>
