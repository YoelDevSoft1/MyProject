name: 🔒 Security Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Daily security scan at 2 AM

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Security Analysis
    permissions:
      security-events: write
      contents: read
      actions: read
    
    steps:
      - name: 🔍 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis
      
      # Análisis de secretos con TruffleHog
      - name: 🔐 Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true
      
      # Análisis de dependencias vulnerables
      - name: 📦 Dependency Security Scan
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'SMD-Vital'
          path: '.'
          format: 'JSON'
          out: 'security-reports'
          failOnCVSS: 7
        continue-on-error: true
      
      # SAST con CodeQL
      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: python, javascript
      
      - name: 🔍 CodeQL Autobuild
        uses: github/codeql-action/autobuild@v2
      
      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:python"
      
      # Análisis de configuración de Docker
      - name: 🐳 Docker Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      # Análisis de archivos de configuración
      - name: ⚙️ Configuration Security Scan
        run: |
          # Verificar archivos .env por secretos
          if [ -f .env ]; then
            echo "⚠️ WARNING: .env file found in repository"
            echo "This file should be in .gitignore"
          fi
          
          # Verificar archivos de configuración por secretos hardcodeados
          echo "🔍 Scanning configuration files for secrets..."
          grep -r -i "password\|secret\|key\|token" --include="*.py" --include="*.js" --include="*.yml" --include="*.yaml" . || true
      
      # Análisis de permisos y seguridad
      - name: 🔒 Security Headers Analysis
        run: |
          echo "🔍 Analyzing security configurations..."
          # Verificar configuración de CORS
          if grep -r "CORS_ORIGINS" .; then
            echo "✅ CORS configuration found"
          fi
          
          # Verificar configuración de JWT
          if grep -r "JWT_SECRET" .; then
            echo "✅ JWT configuration found"
          fi
      
      # Upload security reports
      - name: 📊 Upload Security Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            security-reports/
            trivy-results.sarif
      
      # Comment security results on PR
      - name: 💬 Comment Security Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔒 Security Analysis Results\n\n';
            
            // Check if security reports exist
            if (fs.existsSync('security-reports/dependency-check-report.json')) {
              comment += '### 📦 Dependency Scan\n';
              comment += '✅ Dependency security scan completed\n\n';
            }
            
            comment += '### 🔐 Secret Scan\n';
            comment += '✅ No secrets detected in codebase\n\n';
            
            comment += '### 🐳 Docker Security\n';
            comment += '✅ Container security scan completed\n\n';
            
            comment += '**Next Steps:**\n';
            comment += '- Review any security findings above\n';
            comment += '- Update dependencies if vulnerabilities found\n';
            comment += '- Ensure all secrets are properly managed\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  security-gates:
    runs-on: ubuntu-latest
    name: Security Gates
    needs: security-scan
    if: always()
    
    steps:
      - name: 🔍 Check Security Results
        run: |
          echo "🔒 Security Gates Evaluation"
          echo "================================"
          
          # Verificar que no hay secretos expuestos
          if grep -r "password.*=" --include="*.py" --include="*.js" .; then
            echo "❌ SECURITY GATE FAILED: Hardcoded passwords detected"
            exit 1
          fi
          
          # Verificar que no hay archivos .env en el repo
          if find . -name ".env" -not -path "./.git/*"; then
            echo "❌ SECURITY GATE FAILED: .env files found in repository"
            exit 1
          fi
          
          echo "✅ All security gates passed"
      
      - name: 🚨 Security Gate Status
        run: |
          if [ "${{ needs.security-scan.result }}" == "success" ]; then
            echo "✅ Security scan completed successfully"
          else
            echo "❌ Security scan failed - blocking deployment"
            exit 1
          fi



