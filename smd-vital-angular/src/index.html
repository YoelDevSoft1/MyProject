<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SMD VITAL - Sistema M&eacute;dico Digital</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SMD VITAL - Sistema M&eacute;dico Digital para gesti&oacute;n de citas, registros m&eacute;dicos y atenci&oacute;n al paciente">
  <meta name="keywords" content="sistema m&eacute;dico, citas m&eacute;dicas, registros m&eacute;dicos, telemedicina, salud digital">
  <meta name="author" content="SMD VITAL Team">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

  <!-- Preconnect to external domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#1f3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SMD VITAL">

  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
    <meta http-equiv="Cross-Origin-Resource-Policy" content="cross-origin">
</head>
<body>
  <app-root></app-root>

  <!-- Loading Spinner -->
  <div id="loading-spinner" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(248, 250, 252, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  ">
    <div style="
      width: 42px;
      height: 42px;
      border: 4px solid #dbeafe;
      border-top: 4px solid #1f3a8a;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    "></div>
  </div>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        const spinner = document.getElementById('loading-spinner');
        if (spinner) {
          spinner.style.opacity = '0';
          spinner.style.transition = 'opacity 200ms ease';
          setTimeout(function() {
            spinner.style.display = 'none';
          }, 220);
        }
      }, 600);
    });
  </script>
</body>
</html>
