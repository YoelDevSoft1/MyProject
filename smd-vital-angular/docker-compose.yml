services:
  smd-vital-angular:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:80"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - API_URL=http://localhost:8001

  # Servicio para producción
  smd-vital-angular-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - API_URL=http://localhost:8001
    profiles:
      - production
