global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus se monitorea a sí mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Monitoreo de los microservicios SMD Vital
  - job_name: 'smd-vital-auth'
    static_configs:
      - targets: ['auth-service:8001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'smd-vital-users'
    static_configs:
      - targets: ['user-service:8002']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'smd-vital-appointments'
    static_configs:
      - targets: ['appointment-service:8003']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'smd-vital-notifications'
    static_configs:
      - targets: ['notification-service:8004']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'smd-vital-medical-records'
    static_configs:
      - targets: ['medical-records-service:8005']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'smd-vital-payments'
    static_configs:
      - targets: ['payment-service:8006']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Monitoreo de infraestructura
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    scrape_interval: 30s

  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    scrape_interval: 30s













