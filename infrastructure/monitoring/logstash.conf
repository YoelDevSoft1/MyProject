input {
  # Escuchar en el puerto 5044 para recibir logs de los microservicios
  beats {
    port => 5044
  }
  
  # También escuchar logs de Docker directamente
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Procesar logs JSON de los microservicios
  if [fields][service] {
    json {
      source => "message"
    }
    
    # Agregar timestamp si no existe
    if ![timestamp] {
      mutate {
        add_field => { "timestamp" => "%{@timestamp}" }
      }
    }
    
    # Convertir timestamp a formato ISO
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
    
    # Agregar metadatos del servicio
    mutate {
      add_field => { 
        "service_name" => "%{[fields][service]}"
        "environment" => "development"
      }
    }
  }
  
  # Procesar logs de Docker
  if [container][name] {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:log_message}" }
    }
    
    # Extraer información del contenedor
    mutate {
      add_field => { 
        "service_name" => "%{[container][name]}"
        "container_id" => "%{[container][id]}"
      }
    }
  }
  
  # Procesar logs de errores
  if [level] == "ERROR" {
    mutate {
      add_tag => [ "error" ]
    }
  }
  
  # Procesar logs de autenticación
  if [type] == "auth_event" {
    mutate {
      add_tag => [ "authentication" ]
    }
  }
  
  # Procesar logs de negocio
  if [type] == "business_event" {
    mutate {
      add_tag => [ "business" ]
    }
  }
  
  # Procesar logs de seguridad
  if [type] == "security_event" {
    mutate {
      add_tag => [ "security" ]
    }
  }
}

output {
  # Enviar a Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "smd-vital-logs-%{+YYYY.MM.dd}"
    template_name => "smd-vital-logs"
    template => "/usr/share/logstash/templates/smd-vital-logs.json"
    template_overwrite => true
  }
  
  # Log de debug (opcional)
  stdout {
    codec => rubydebug
  }
}


















