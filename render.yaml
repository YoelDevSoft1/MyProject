services:
  # Backend API Service
  - type: web
    name: smd-vital-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: python main-simple.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smd-vital-db
          property: connectionString
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://smd-vital-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

  # Frontend Service
  - type: web
    name: smd-vital-frontend
    env: static
    buildCommand: chmod +x build-frontend.sh && ./build-frontend.sh
    staticPublishPath: horizon-ui-chakra-main/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://smd-vital-backend.onrender.com
      - key: GENERATE_SOURCEMAP
        value: "false"
      - key: DISABLE_ESLINT_PLUGIN
        value: "true"

databases:
  - name: smd-vital-db
    plan: free
    databaseName: smd_vital
    user: smd_vital_user
