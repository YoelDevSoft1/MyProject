# SMD Vital Backend - Docker Compose Completo
# ============================================
# Todos los servicios incluyendo monitoreo y observabilidad

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smd_vital_postgres
    environment:
      POSTGRES_DB: smdvital
      POSTGRES_USER: smdvital
      POSTGRES_PASSWORD: smdvital_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=es_CO.UTF-8 --lc-ctype=es_CO.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - smd_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smdvital -d smdvital"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: smd_vital_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis_password_2024
    volumes:
      - redis_data:/data
    networks:
      - smd_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password_2024", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: smd_vital_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: smdvital
      RABBITMQ_DEFAULT_PASS: rabbitmq_password_2024
      RABBITMQ_DEFAULT_VHOST: smdvital
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - smd_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # API Gateway (Nginx)
  nginx:
    image: nginx:alpine
    container_name: smd_vital_nginx
    ports:
      - "8000:80"
    volumes:
      - ./infrastructure/nginx/nginx-simple.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - appointment-service
      - notification-service
      - medical-records-service
      - payment-service
    networks:
      - smd_network
    restart: unless-stopped

  # Authentication Service
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: smd_vital_auth
    environment:
      - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital_auth
      - REDIS_URL=redis://:redis_password_2024@redis:6379/0
      - JWT_SECRET_KEY=super_secret_jwt_key_for_smd_vital_2024
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/auth:/app
      - ./shared:/app/shared
    networks:
      - smd_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # User Service
  user-service:
    build:
      context: ./services/users
      dockerfile: Dockerfile
    container_name: smd_vital_users
    environment:
      - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital_users
      - REDIS_URL=redis://:redis_password_2024@redis:6379/1
      - AUTH_SERVICE_URL=http://auth-service:8001
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    volumes:
      - ./services/users:/app
      - ./shared:/app/shared
    networks:
      - smd_network
    restart: unless-stopped

  # Appointment Service
  appointment-service:
    build:
      context: ./services/appointments
      dockerfile: Dockerfile
    container_name: smd_vital_appointments
    environment:
      - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital_appointments
      - REDIS_URL=redis://:redis_password_2024@redis:6379/2
      - RABBITMQ_URL=amqp://smdvital:rabbitmq_password_2024@rabbitmq:5672/smdvital
      - AUTH_SERVICE_URL=http://auth-service:8001
      - USER_SERVICE_URL=http://user-service:8002
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    volumes:
      - ./services/appointments:/app
      - ./shared:/app/shared
    networks:
      - smd_network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    container_name: smd_vital_notifications
    environment:
      - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital_notifications
      - REDIS_URL=redis://:redis_password_2024@redis:6379/3
      - RABBITMQ_URL=amqp://smdvital:rabbitmq_password_2024@rabbitmq:5672/smdvital
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN:-}
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/notifications:/app
      - ./shared:/app/shared
    networks:
      - smd_network
    restart: unless-stopped

  # Medical Records Service
  medical-records-service:
    build:
      context: ./services/medical-records
      dockerfile: Dockerfile.simple
    container_name: smd_vital_medical_records
    environment:
      - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital_medical_records
      - REDIS_URL=redis://:redis_password_2024@redis:6379/4
      - AUTH_SERVICE_URL=http://auth-service:8001
      - USER_SERVICE_URL=http://user-service:8002
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    volumes:
      - ./services/medical-records:/app
      - ./shared:/app/shared
      - medical_files:/app/uploads
    networks:
      - smd_network
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: ./services/payments
      dockerfile: Dockerfile
    container_name: smd_vital_payments
    environment:
      - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital_payments
      - REDIS_URL=redis://:redis_password_2024@redis:6379/5
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - USER_SERVICE_URL=http://user-service:8002
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    volumes:
      - ./services/payments:/app
      - ./shared:/app/shared
    networks:
      - smd_network
    restart: unless-stopped

  # AI LangGraph Service
  ai-langgraph:
    build:
      context: ./services/ai-langgraph
      dockerfile: Dockerfile
    container_name: smd_vital_ai_langgraph
    ports:
      - "8008:8008"
    environment:
      - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital_ai
      - REDIS_URL=redis://:redis_password_2024@redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./services/ai-langgraph/logs:/app/logs
      - ./services/ai-langgraph/temp:/app/temp
      - ./services/ai-langgraph/models:/app/models
      - ./services/ai-langgraph/data:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - smd_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Health Metrics Service (TEMPORALMENTE DESHABILITADO - Problema WeasyPrint)
  # health-metrics-service:
  #   build:
  #     context: ./services/medical-records
  #     dockerfile: Dockerfile.simple
  #   container_name: smd_vital_health_metrics
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital_medical_records
  #     - REDIS_URL=redis://:redis_password_2024@redis:6379/6
  #     - AUTH_SERVICE_URL=http://auth-service:8001
  #     - USER_SERVICE_URL=http://user-service:8002
  #     - ENVIRONMENT=development
  #     - DEBUG=true
  #   ports:
  #     - "8007:8007"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     auth-service:
  #       condition: service_healthy
  #   volumes:
  #     - ./services/medical-records:/app
  #     - ./shared:/app/shared
  #   networks:
  #     - smd_network
  #   restart: unless-stopped

  # Celery Worker
  celery-worker:
    build: 
      context: ./services/notifications
      dockerfile: Dockerfile
    environment:
      - CELERY_BROKER_URL=amqp://smdvital:rabbitmq_password_2024@rabbitmq:5672/smdvital
      - CELERY_RESULT_BACKEND=redis://:redis_password_2024@redis:6379/3
      - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital
      - USER_SERVICE_URL=http://user-service:8002
      - APPOINTMENT_SERVICE_URL=http://appointment-service:8003
      - NOTIFICATION_SERVICE_URL=http://notification-service:8004
      - MEDICAL_RECORDS_SERVICE_URL=http://medical-records-service:8005
      - PAYMENT_SERVICE_URL=http://payment-service:8006
      - AUTH_SERVICE_URL=http://auth-service:8001
      - ENVIRONMENT=development
      - DEBUG=true
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - user-service
      - notification-service
      - appointment-service
    networks:
      - smd_network
    volumes:
      - ./services/notifications:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
    restart: unless-stopped

  # Celery Beat
  celery-beat:
    build: 
      context: ./services/notifications
      dockerfile: Dockerfile
    container_name: smd_vital_celery_beat
    environment:
      - CELERY_BROKER_URL=amqp://smdvital:rabbitmq_password_2024@rabbitmq:5672/smdvital
      - CELERY_RESULT_BACKEND=redis://:redis_password_2024@redis:6379/3
      - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital
      - BEAT_SCHEDULE_FILE=/app/celerybeat-schedule
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - smd_network
    volumes:
      - ./services/notifications:/app
      - ./shared:/app/shared
    restart: unless-stopped

  # Flower (Celery Monitoring)
  flower:
    build: 
      context: ./services/notifications
      dockerfile: Dockerfile
    container_name: smd_vital_flower
    environment:
      - CELERY_BROKER_URL=amqp://smdvital:rabbitmq_password_2024@rabbitmq:5672/smdvital
      - CELERY_RESULT_BACKEND=redis://:redis_password_2024@redis:6379/3
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - smd_network
    volumes:
      - ./services/notifications:/app
    restart: unless-stopped

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: smd_vital_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - smd_network
    restart: unless-stopped

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: smd_vital_grafana
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-smdvital_grafana_2024}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY:-smdvital_grafana_secret_key_2024}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - smd_network
    restart: unless-stopped

  # Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: smd_vital_jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
    networks:
      - smd_network
    restart: unless-stopped

  # Elasticsearch (Logging)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: smd_vital_elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=smd-vital-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - smd_network
    restart: unless-stopped

  # Kibana (Log Visualization)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: smd_vital_kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - smd_network
    restart: unless-stopped

  # Logstash (Log Processing)
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: smd_vital_logstash
    ports:
      - "5000:5000"  # TCP input para logs
      - "5044:5044"  # Beats input
    volumes:
      - ./infrastructure/monitoring/logstash-pipeline.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./infrastructure/monitoring/elasticsearch-template.json:/usr/share/logstash/templates/smd-vital-logs.json
    depends_on:
      - elasticsearch
    networks:
      - smd_network
    restart: unless-stopped

# Networks
networks:
  smd_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  medical_files:
    driver: local
  celery-beat-schedule:
    driver: local
