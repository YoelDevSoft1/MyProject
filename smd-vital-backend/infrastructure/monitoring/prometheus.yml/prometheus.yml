global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'smd-vital-services'
    static_configs:
      - targets: 
        - 'auth-service:8001'
        - 'user-service:8002'
        - 'appointment-service:8003'
        - 'notification-service:8004'
        - 'medical-records-service:8005'
        - 'payment-service:8006'
    metrics_path: '/metrics'
    scrape_interval: 30s
