# Configuración a nivel global
user nginx;
worker_processes auto;  # Se ajusta automáticamente al número de CPUs
pid /var/run/nginx.pid;

events {
    worker_connections 2048;  # Aumentado para mejor rendimiento
    multi_accept on;  # Aceptar múltiples conexiones a la vez
    use epoll;  # Mejor escalabilidad en Linux
}

http {
    # Inclusión de archivos básicos
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimización de buffers
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 4 4k;

    # Configuración de timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 65;
    send_timeout 10;

    # Configuración de logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=16k;
    error_log /var/log/nginx/error.log warn;

    # Optimizaciones de rendimiento
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;  # Ocultar versión de Nginx por seguridad

    # Compresión Gzip mejorada
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/vnd.ms-fontobject
        font/ttf
        font/opentype;

    # Rate limiting mejorado
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_status 429;  # Usar código 429 (Too Many Requests)

    # Upstream services con configuraciones mejoradas
    upstream auth-service {
        server auth-service:8001;
        keepalive 32;  # Conexiones persistentes para mejor rendimiento
    }

    upstream user-service {
        server user-service:8002;
        keepalive 32;
    }

    upstream appointment-service {
        server appointment-service:8003;
        keepalive 32;
    }

    upstream medical-records-service {
        server smd_vital_medical_records:8005;
        keepalive 32;
    }

    upstream payment-service {
        server payment-service:8006;
        keepalive 32;
    }

    upstream notification-service {
        server notification-service:8004;
        keepalive 32;
    }

    upstream ai-langgraph-service {
        server ai-langgraph:8008;
        keepalive 32;
    }

    # Snippet reutilizable para CORS
    map $request_method $cors_method {
        OPTIONS 11;
        default 0;
    }

    # Bloque server principal
    server {
        listen 80;
        server_name localhost;
        root /var/www/html;

        # Cabeceras de seguridad mejoradas
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


        # Endpoint de health check con CORS
        location /health {
            # Handle CORS preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "http://localhost:3001" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }
            
            access_log off;
            add_header Content-Type text/plain;
            add_header Access-Control-Allow-Origin "http://localhost:3001" always;
            add_header Access-Control-Allow-Credentials "true" always;
            return 200 "healthy\n";
        }

        # Endpoint de status para monitoreo
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }


        # Rutas del API Gateway con configuración optimizada
        
        # Regla específica para Google OAuth - CORS manejado por auth-service
        location = /api/auth/google {
            proxy_pass http://auth-service/google;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Regla específica para Auth Service - perfil de usuario - CORS manejado por auth-service
        location = /api/auth/me {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://auth-service/me;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Regla específica para Users Service
        location /api/users/ {
            limit_req zone=api burst=20 nodelay;
            
            # Manejo de preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "http://localhost:3001";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Max-Age 0;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }
            
            # Redirigir al servicio de usuarios (remover /api/users del path)
            proxy_pass http://user-service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Headers CORS solo para respuestas exitosas
            add_header Access-Control-Allow-Origin "http://localhost:3001";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            add_header Access-Control-Allow-Credentials "true";
        }
        
        # Regla para API v1 de autenticación - CORS manejado por auth-service
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            rewrite /api/v1/auth/(.*) /$1 break;
            proxy_pass http://auth-service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

