# SMD Vital Backend - Docker Compose
# ==================================
# Configuración adicional para docker-compose.yml
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smd_vital_postgres
    environment:
      POSTGRES_DB: smdvital
      POSTGRES_USER: smdvital
      POSTGRES_PASSWORD: smdvital_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=es_CO.UTF-8 --lc-ctype=es_CO.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - smd-vital-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smdvital -d smdvital"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis con configuración optimizada
  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    container_name: smd_vital_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - smd-vital-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password_2024", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # RabbitMQ con configuración de producción
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: smd_vital_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: smdvital
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_DEFAULT_VHOST: smdvital
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - smd-vital-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Configuración mejorada de Nginx
  nginx:
    image: nginx:alpine
    container_name: smd_vital_nginx
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/sites-enabled:/etc/nginx/sites-enabled
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - auth-service
      - user-service
      - appointment-service
      - notification-service
      - medical-records-service
      - payment-service
    networks:
      - smd-vital-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # Authentication Service
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: smd_vital_auth
    environment:
      - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital_users
      - REDIS_URL=redis://:redis_password_2024@redis:6379/0
      - JWT_SECRET_KEY=super_secret_jwt_key_for_smd_vital_2024
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/auth:/app
      - ./shared:/app/shared
    networks:
      - smd-vital-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # User Service
  user-service:
    build:
      context: ./services/users
      dockerfile: Dockerfile
    container_name: smd_vital_users
    environment:
      - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital_users
      - REDIS_URL=redis://:redis_password_2024@redis:6379/1
      - AUTH_SERVICE_URL=http://auth-service:8001
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    volumes:
      - ./services/users:/app
      - ./shared:/app/shared
    networks:
      - smd-vital-network
    restart: unless-stopped

  # Appointment Service
  appointment-service:
    build:
      context: ./services/appointments
      dockerfile: Dockerfile
    container_name: smd_vital_appointments
    environment:
      - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital_appointments
      - REDIS_URL=redis://:redis_password_2024@redis:6379/2
      - RABBITMQ_URL=amqp://smdvital:rabbitmq_password_2024@rabbitmq:5672/smdvital
      - AUTH_SERVICE_URL=http://auth-service:8001
      - USER_SERVICE_URL=http://user-service:8002
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    volumes:
      - ./services/appointments:/app
      - ./shared:/app/shared
    networks:
      - smd-vital-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    container_name: smd_vital_notifications
    environment:
      - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital_notifications
      - REDIS_URL=redis://:redis_password_2024@redis:6379/3
      - RABBITMQ_URL=amqp://smdvital:rabbitmq_password_2024@rabbitmq:5672/smdvital
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/notifications:/app
      - ./shared:/app/shared
    networks:
      - smd-vital-network
    restart: unless-stopped

  # Medical Records Service
  medical-records-service:
    build:
      context: ./services/medical-records
      dockerfile: Dockerfile
    container_name: smd_vital_medical_records
    environment:
      - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital_medical_records
      - REDIS_URL=redis://:redis_password_2024@redis:6379/4
      - AUTH_SERVICE_URL=http://auth-service:8001
      - USER_SERVICE_URL=http://user-service:8002
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    volumes:
      - ./services/medical-records:/app
      - ./shared:/app/shared
      - medical_files:/app/uploads
    networks:
      - smd-vital-network
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: ./services/payments
      dockerfile: Dockerfile
    container_name: smd_vital_payments
    environment:
      - DATABASE_URL=postgresql+asyncpg://smdvital:smdvital_password_2024@postgres:5432/smdvital_payments
      - REDIS_URL=redis://:redis_password_2024@redis:6379/5
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - PSE_MERCHANT_ID=${PSE_MERCHANT_ID}
      - PSE_API_KEY=${PSE_API_KEY}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - USER_SERVICE_URL=http://user-service:8002
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    volumes:
      - ./services/payments:/app
      - ./shared:/app/shared
    networks:
      - smd-vital-network
    restart: unless-stopped

  # Celery Worker con configuración de microservicios
  celery-worker:
    build: 
      context: ./services/notifications
      dockerfile: Dockerfile.celery
    environment:
      - CELERY_BROKER_URL=amqp://smdvital:password@rabbitmq:5672/smdvital
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
      - DATABASE_URL=postgresql://smdvital:password@postgres:5432/smdvital
      
      # Service Discovery
      - USER_SERVICE_URL=http://user-service:8002
      - APPOINTMENT_SERVICE_URL=http://appointment-service:8003
      - NOTIFICATION_SERVICE_URL=http://notification-service:8004
      - MEDICAL_RECORDS_SERVICE_URL=http://medical-records-service:8005
      - PAYMENT_SERVICE_URL=http://payment-service:8006
      - AUTH_SERVICE_URL=http://auth-service:8001
      
      # Observabilidad
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
      - PROMETHEUS_GATEWAY=http://prometheus:9090
      
      # Logging
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - LOG_LEVEL=INFO
      
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - user-service
      - notification-service
      - appointment-service
      - jaeger
      - elasticsearch
    networks:
      - smd-vital-network
    volumes:
      - ./services/notifications:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
    restart: unless-stopped
    deploy:
      replicas: 3  # Múltiples workers para alta disponibilidad
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Celery Beat con alta disponibilidad
  celery-beat:
    build: 
      context: ./services/notifications
      dockerfile: Dockerfile.celery-beat
    container_name: smd_vital_celery_beat
    environment:
      - CELERY_BROKER_URL=amqp://smdvital:password@rabbitmq:5672/smdvital
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
      - DATABASE_URL=postgresql://smdvital:password@postgres:5432/smdvital
      - BEAT_SCHEDULE_FILE=/app/celerybeat-schedule
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - smd-vital-network
    volumes:
      - ./services/notifications:/app
      - ./shared:/app/shared
    restart: unless-stopped
    deploy:
      replicas: 1  # Solo una instancia para evitar tareas duplicadas
      placement:
        constraints: [node.role == manager]

  # Flower con autenticación
  flower:
    build: 
      context: ./services/notifications
      dockerfile: Dockerfile.flower
    container_name: smd_vital_flower
    environment:
      - CELERY_BROKER_URL=amqp://smdvital:password@rabbitmq:5672/smdvital
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - smd-vital-network
    volumes:
      - ./services/notifications:/app
    restart: unless-stopped

  # Prometheus con configuración para microservicios
  prometheus:
    image: prom/prometheus:latest
    container_name: smd_vital_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - smd-vital-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: smd_vital_grafana
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=
      
      
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - smd-vital-network
    restart: unless-stopped

  # Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: smd_vital_jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
    networks:
      - smd-vital-network
    restart: unless-stopped

  # Elasticsearch (Logging)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: smd_vital_elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=smd-vital-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - smd-vital-network
    restart: unless-stopped

  # Kibana (Log Visualization)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: smd_vital_kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - smd-vital-network
    restart: unless-stopped

  # Logstash (Log Processing)
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: smd_vital_logstash
    volumes:
      - ./infrastructure/logging/logstash.conf/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch
    networks:
      - smd-vital-network
    restart: unless-stopped

# Networks
networks:
  smd-vital-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  medical_files:
    driver: local
  celery-beat-schedule:
    driver: local
