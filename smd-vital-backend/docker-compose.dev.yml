# SMD Vital Backend - Docker Compose para Desarrollo
# ================================================
# Versión simplificada sin volúmenes problemáticos

services:
  # Authentication Service
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: smd_vital_auth
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# Networks
networks:
  default:
    driver: bridge
