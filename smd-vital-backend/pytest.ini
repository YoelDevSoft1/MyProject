[tool:pytest]
# Pytest Configuration for SMD VITAL
# ==================================

# Test Discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    load: Load tests
    security: Security tests
    slow: Slow running tests
    auth: Authentication tests
    medical: Medical data tests
    payment: Payment tests
    notification: Notification tests

# Output Options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=.
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --junitxml=test-results.xml
    --html=test-report.html
    --self-contained-html

# Async Configuration
asyncio_mode = auto

# Test Timeout
timeout = 300

# Parallel Execution
-n auto

# Coverage Configuration
[coverage:run]
source = .
omit = 
    tests/*
    */tests/*
    */venv/*
    */env/*
    */migrations/*
    */alembic/*
    setup.py
    conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
