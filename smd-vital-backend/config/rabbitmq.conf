# RabbitMQ Configuration for SMD Vital
# ====================================

# Network
listeners.tcp.default = 5672
management.tcp.port = 15672

# Memory Management
vm_memory_high_watermark.relative = 0.8
vm_memory_high_watermark_paging_ratio = 0.5
disk_free_limit.absolute = 2GB

# Connection Limits
num_acceptors.tcp = 10
handshake_timeout = 10000
heartbeat = 60
frame_max = 131072
channel_max = 2047

# Queue Management
queue_master_locator = min-masters
queue_index_embed_msgs_below = 4096
msg_store_file_size_limit = 16777216
queue_index_embed_msgs_below = 4096

# Clustering
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq

# Logging
log.console = true
log.console.level = info
log.file = false
log.file.level = info
log.file.rotation.date = $D0
log.file.rotation.size = 0

# Management
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0
management.http_log_dir = /var/log/rabbitmq

# Security
default_user = smdvital
default_pass = password
default_vhost = smdvital
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# Performance
tcp_listen_options.backlog = 128
tcp_listen_options.nodelay = true
tcp_listen_options.keepalive = true
tcp_listen_options.exit_on_close = false

# Resource Limits
collect_statistics_interval = 5000
hipe_compilation = false

# SSL/TLS (disabled for development)
# ssl_options.cacertfile = /etc/ssl/certs/ca-cert.pem
# ssl_options.certfile = /etc/ssl/certs/server-cert.pem
# ssl_options.keyfile = /etc/ssl/private/server-key.pem
# ssl_options.verify = verify_peer
# ssl_options.fail_if_no_peer_cert = false

# Policies
# policies.ha-mode = all
# policies.ha-sync-mode = automatic
# policies.ha-sync-batch-size = 1

# Consumer Timeout
consumer_timeout = 30000

# Message TTL
# x-message-ttl = 3600000

# Queue TTL
# x-expires = 3600000

# Dead Letter Exchange
# x-dead-letter-exchange = dlx
# x-dead-letter-routing-key = dlq
