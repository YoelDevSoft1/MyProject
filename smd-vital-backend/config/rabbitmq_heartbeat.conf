# RabbitMQ Heartbeat Configuration - BASED ON WEB RESEARCH
# ======================================================

# Heartbeat configuration - CRITICAL FOR STABILITY
heartbeat = 30

# Connection settings
tcp_listen_options.backlog = 128
tcp_listen_options.nodelay = true
tcp_listen_options.keepalive = true
tcp_listen_options.send_timeout = 30000
tcp_listen_options.recv_timeout = 30000

# Memory settings
vm_memory_high_watermark.relative = 0.6

# Disk settings
disk_free_limit.absolute = 1GB

# Channel limits
channel_max = 2000

# Connection limits
connection_max = 200

# Management
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# Logging - REDUCE WARNINGS
log.console = true
log.console.level = warning
log.connection = false
log.channel = false
log.queue = false
log.exchange = false

