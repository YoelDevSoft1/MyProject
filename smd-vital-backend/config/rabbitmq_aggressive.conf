# RabbitMQ Aggressive Configuration - ZERO WARNINGS
# ================================================

# SUPPRESS ALL CONNECTION WARNINGS
log.console = true
log.console.level = error
log.file = false

# COMPLETELY DISABLE CONNECTION LOGGING
log.connection = false
log.channel = false
log.queue = false
log.exchange = false
log.federation = false
log.mirroring = false

# Connection management - AGGRESSIVE
connection_max = 500
heartbeat = 120
tcp_listen_options.backlog = 512
tcp_listen_options.nodelay = true
tcp_listen_options.keepalive = true
tcp_listen_options.send_timeout = 60000
tcp_listen_options.recv_timeout = 60000
tcp_listen_options.reuseaddr = true
tcp_listen_options.exit_on_close = false

# Memory management - AGGRESSIVE
vm_memory_high_watermark.relative = 0.8
vm_memory_high_watermark_paging_ratio = 0.7
vm_memory_calculation_strategy = rss

# Disk management - AGGRESSIVE
disk_free_limit.absolute = 5GB
disk_free_limit.relative = 5.0

# Channel limits - AGGRESSIVE
channel_max = 5000

# Connection timeout - AGGRESSIVE
handshake_timeout = 30000

# Frame size limits - AGGRESSIVE
frame_max = 262144

# Connection churn protection - AGGRESSIVE
connection_max = 500

# Management plugin - DISABLE LOGGING
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0
management.logging = false

# Queue configuration - AGGRESSIVE
queue_master_locator = min-masters
queue_index_embed_msgs_below = 8192

# Network configuration - AGGRESSIVE
tcp_listen_options.reuseaddr = true
tcp_listen_options.exit_on_close = false

# Connection limits per user - AGGRESSIVE
default_user_tags.administrator = true
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# SUPPRESS ALL WARNINGS
log.default.level = error
log.console.level = error
log.file.level = error

