# SMD VITAL - Configuración Optimizada de Ollama para Velocidad
# =============================================================
# Configuración optimizada para 24GB de RAM

# Configuración de memoria optimizada
OLLAMA_MAX_LOADED_MODELS=2
OLLAMA_NUM_PARALLEL=4
OLLAMA_FLASH_ATTENTION=1

# Configuración de CPU optimizada
OLLAMA_GPU_LAYERS=0
OLLAMA_THREADS=8

# Configuración de red
OLLAMA_HOST=0.0.0.0
OLLAMA_ORIGINS=*

# Configuración de caché
OLLAMA_KEEP_ALIVE=5m
OLLAMA_KEEP_ALIVE_REQUEST=2m

# Configuración de logs
OLLAMA_DEBUG=0
OLLAMA_VERBOSE=0

# Configuración de modelos
OLLAMA_MODELS=/root/.ollama/models
OLLAMA_TMPDIR=/tmp/ollama

# Configuración de memoria específica
OLLAMA_MAX_QUEUE=512
OLLAMA_MAX_BATCH_SIZE=512
OLLAMA_MAX_SEQ_LEN=2048
