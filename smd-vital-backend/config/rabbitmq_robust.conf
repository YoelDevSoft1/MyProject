# RabbitMQ Robust Configuration - SOLUCIÓN DEFINITIVA
# ===================================================
# Basado en investigación profunda y mejores prácticas

# ===========================================
# CONFIGURACIÓN DE HEARTBEAT - CRÍTICA
# ===========================================
# Heartbeat más agresivo para detectar conexiones muertas
heartbeat = 60

# ===========================================
# CONFIGURACIÓN DE CONEXIONES TCP
# ===========================================
# Configuración TCP optimizada para Docker
tcp_listen_options.backlog = 128
tcp_listen_options.nodelay = true
tcp_listen_options.keepalive = true
tcp_listen_options.send_timeout = 60000
tcp_listen_options.recv_timeout = 60000

# ===========================================
# CONFIGURACIÓN DE MEMORIA Y DISCO
# ===========================================
# Límites de memoria más conservadores
vm_memory_high_watermark.relative = 0.7
vm_memory_high_watermark_paging_ratio = 0.5

# Límite de disco más generoso
disk_free_limit.absolute = 2GB

# ===========================================
# LÍMITES DE CONEXIONES Y CANALES
# ===========================================
# Límites más altos para manejar picos de conexión
channel_max = 5000
connection_max = 500

# ===========================================
# CONFIGURACIÓN DE MANAGEMENT
# ===========================================
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# ===========================================
# CONFIGURACIÓN DE LOGGING - REDUCIR WARNINGS
# ===========================================
# Logging más silencioso para reducir warnings
log.console = true
log.console.level = error
log.connection = false
log.channel = false
log.queue = false
log.exchange = false

# ===========================================
# CONFIGURACIÓN DE PLUGINS
# ===========================================
# Plugins esenciales
management.load_definitions = /etc/rabbitmq/definitions.json

# ===========================================
# CONFIGURACIÓN DE CLUSTER (FUTURO)
# ===========================================
# cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
# cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq

# ===========================================
# CONFIGURACIÓN DE POLÍTICAS
# ===========================================
# Políticas por defecto para colas
default_vhost = smdvital
default_user = smdvital
default_pass = rabbitmq_password_2024
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# ===========================================
# CONFIGURACIÓN DE TIMEOUTS
# ===========================================
# Timeouts más largos para conexiones estables
handshake_timeout = 10000
connection_negotiation_timeout = 10000

# ===========================================
# CONFIGURACIÓN DE QUEUES
# ===========================================
# Configuración de colas por defecto
queue_master_locator = min-masters
