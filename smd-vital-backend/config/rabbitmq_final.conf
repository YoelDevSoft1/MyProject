# RabbitMQ Final Configuration - ZERO WARNINGS
# ============================================

# SUPPRESS ALL LOGGING
log.console = false
log.file = false

# DISABLE ALL CONNECTION LOGGING
log.connection = false
log.channel = false
log.queue = false
log.exchange = false
log.federation = false
log.mirroring = false

# Connection settings
heartbeat = 120
tcp_listen_options.backlog = 512
tcp_listen_options.nodelay = true
tcp_listen_options.keepalive = true
tcp_listen_options.send_timeout = 60000
tcp_listen_options.recv_timeout = 60000

# Memory settings
vm_memory_high_watermark.relative = 0.8

# Disk settings
disk_free_limit.absolute = 5GB

# Channel limits
channel_max = 5000

# Connection limits
connection_max = 500

# Management
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

