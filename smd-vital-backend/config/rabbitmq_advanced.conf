# RabbitMQ Advanced Configuration - Production Ready
# =================================================

# Connection management
connection_max = 200
heartbeat = 60
tcp_listen_options.backlog = 256
tcp_listen_options.nodelay = true
tcp_listen_options.keepalive = true
tcp_listen_options.send_timeout = 30000
tcp_listen_options.recv_timeout = 30000
tcp_listen_options.reuseaddr = true
tcp_listen_options.exit_on_close = false

# Memory management
vm_memory_high_watermark.relative = 0.6
vm_memory_high_watermark_paging_ratio = 0.5
vm_memory_calculation_strategy = rss

# Disk management
disk_free_limit.absolute = 2GB
disk_free_limit.relative = 2.0

# Logging configuration - SUPPRESS CONNECTION WARNINGS
log.console = true
log.console.level = error
log.file = false
log.connection = false
log.channel = false
log.queue = false
log.exchange = false

# Suppress specific warnings
log.connection.level = error
log.channel.level = error
log.queue.level = error
log.exchange.level = error

# Management plugin
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# Queue configuration
queue_master_locator = min-masters
queue_index_embed_msgs_below = 4096

# Network configuration
tcp_listen_options.reuseaddr = true
tcp_listen_options.exit_on_close = false

# Connection limits per user
default_user_tags.administrator = true
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# Channel limits
channel_max = 2000

# Connection timeout
handshake_timeout = 10000

# Frame size limits
frame_max = 131072

# Connection churn protection
connection_max = 200
